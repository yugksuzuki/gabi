# Fotografia de PROCESSO — o segundo registro do site.
#
# docs/06 §2 levantou 12 arquivos DSC*.JPG em `GAB/Site gseleme`: preto e branco,
# vista de cima, a artista trabalhando sobre a peça. São editoriais, de revista —
# e docs/06 §3 registra que convivem sem briga com a fotografia de obra em
# cinza-neutro. É esse par que dá ritmo de publicação à home.
#
# LIGADO em 26/08/2026. As 12 chegaram (o Guilherme empurrou direto para o
# branch, porque a rede daqui não alcança o Drive). Entram TRÊS: as únicas
# realmente em preto e branco do conjunto — saturação medida 0,0, contra 9 a 52
# das outras nove. Não é gosto: é o argumento de docs/06 §3, de que P&B de
# processo e cinza-neutro de obra convivem sem briga.
#
#   /atelie/maos.jpg       DSC03609 Copy — mãos abertas sobre a peça
#   /atelie/espelhada.jpg  DSC03561 Copy — composição espelhada
#   /atelie/materia.jpg    DSC03574 Copy — a matéria sozinha, panorâmica
#
# Duas faixas, não três: a terceira empurraria a última obra para longe demais
# da entrada e o ateliê passaria a competir com o portfólio.
#
# As nove restantes ficam em ativos/ para textos e usos futuros. A DSC04198
# (saturação 51,8 — o rastro de neon) segue fora do par P&B, como docs/06 previa.
#
# ATENÇÃO ao conteúdo: estas fotos mostram um trabalho em FIBRA — lã, fio,
# enchimento. Não é gesso e massa acrílica sobre tela. É outro corpo de obra da
# mesma artista, e por isso a legenda diz "Ateliê", nunca "Encontro em processo".

faixas:
  - depois_de: encontro
    imagens: [/atelie/maos.jpg, /atelie/espelhada.jpg]
    legenda: Ateliê · trabalho em fibra
  - depois_de: desabrochar
    imagens: [/atelie/materia.jpg]
    legenda: Ateliê · a matéria
